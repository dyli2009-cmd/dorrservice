<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dörrservice</title><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script></head>
<body><header><strong>🚪 Dörrservice</strong><label class="filebtn primary" for="file">Ladda upp ritning</label><input id="file" type="file" accept="application/pdf"><button id="addBtn">+ Lägg till dörr</button></header><div id="hint">Tryck på ritningen där dörren finns.</div><div class="pagebar"><button id="prev">←</button><span id="pageInfo">Ingen ritning</span><button id="next">→</button><span id="doorCount">0 dörrar</span></div><main><section id="viewerWrap"><div id="stage"><canvas id="pdfCanvas"></canvas><div id="markers"></div></div></section><aside><div id="empty"><h2>Provningsprotokoll</h2><p>Välj en dörr på ritningen.</p></div><div id="form" hidden><h2 id="formTitle"></h2><label>Dörr-ID<input id="doorId"></label><label>Automatik / modell<input id="model" placeholder="SW100, SW300, ED100..."></label><label>Status<select id="status"><option value="untested">Ej provad</option><option value="ok">Godkänd</option><option value="fail">Ej godkänd</option><option value="action">Åtgärd krävs</option></select></label><div class="checks"><label><input type="checkbox" id="opening"> Öppning/stängning</label><label><input type="checkbox" id="sensor"> Säkerhetssensor</label><label><input type="checkbox" id="impulse"> Impulsdon</label><label><input type="checkbox" id="lock"> Lås/el-slutbleck</label></div><label>Anteckning<textarea id="notes" rows="5"></textarea></label><button class="danger" id="deleteBtn">Ta bort dörr</button></div></aside></main><script src="app.js"></script></body></html>
