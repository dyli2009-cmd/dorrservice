<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Dörrservice</title><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<header><strong>🚪 Dörrservice</strong><label class="filebtn primary" for="file">Ladda ritning</label><input id="file" type="file" accept="application/pdf"><button id="addBtn">+ Dörr</button><button id="exportBtn">PDF-rapport</button></header>
<div id="hint">Tryck på ritningen där dörren finns.</div>
<div class="pagebar"><button id="prev">←</button><span id="pageInfo">Ingen ritning</span><button id="next">→</button><button id="zoomOut">−</button><span id="zoomInfo">100%</span><button id="zoomIn">+</button><button id="fitBtn">Anpassa</button><span id="doorCount">0 dörrar</span></div>
<main><section id="viewerWrap"><div id="stage"><canvas id="pdfCanvas"></canvas><div id="markers"></div></div></section>
<aside><div id="empty"><h2>Provningsprotokoll</h2><p>Välj en dörr på ritningen.</p></div><div id="form" hidden>
<h2 id="formTitle"></h2><div class="grid2"><label>Dörr-ID<input id="doorId"></label><label>Maskin-ID<input id="machineId"></label><label>Placering / dörrlittra<input id="location"></label><label>Automatik / modell<input id="model" placeholder="SW100, SW300, ED100..."></label><label>AO / order<input id="ao"></label><label>Nästa provning<input id="nextDate" type="date"></label></div>
<label>Övergripande status<select id="status"><option value="untested">Ej provad</option><option value="ok">Godkänd</option><option value="action">Åtgärd krävs</option><option value="fail">Ej godkänd</option></select></label>
<h3>Checklista revision dörrautomatik</h3><div id="checklist"></div>
<label>Allmän info / anmärkning<textarea id="notes" rows="4"></textarea></label><label>Signatur<input id="signature" placeholder="Initialer"></label>
<button class="danger" id="deleteBtn">Ta bort dörr</button></div></aside></main><script src="app.js"></script></body></html>
