<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Dörrservice</title><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<header><strong>🚪 Dörrservice</strong><label class="filebtn primary" for="file">Ritning</label><input id="file" type="file" accept="application/pdf"><button id="settingsBtn">Projekt</button><button id="exportBtn">PDF</button></header>
<section id="projectPanel" hidden><h2>Projekt & protokoll</h2><div class="grid2"><label>Logotyp<input id="logoFile" type="file" accept="image/*"></label><label>Objekt<input id="projectName"></label><label>Anläggningsnummer<input id="facilityNo"></label><label>Beställare<input id="customer"></label><label>Kontaktperson<input id="contact"></label><label>Order / AO<input id="projectOrder"></label><label>Datum<input id="inspectionDate" type="date"></label><label>Nästa provning<input id="projectNextDate" type="date"></label><label>Företag / tekniker<input id="company"></label><label>Telefon<input id="phone"></label></div><div id="logoPreview"></div></section>
<div id="hint">PLACERINGSLÄGE – tryck exakt där dörren finns. Nyp för zoom.</div>
<div class="pagebar"><button id="prev">←</button><span id="pageInfo">Ingen ritning</span><button id="next">→</button><button id="zoomOut">−</button><span id="zoomInfo">100%</span><button id="zoomIn">+</button><button id="fitBtn">Passa</button><span id="doorCount">0 dörrar</span></div>
<main><section id="viewerWrap"><div id="stage"><canvas id="pdfCanvas"></canvas><div id="markers"></div></div></section><aside id="protocolPanel"><div class="sheetHead"><h2>Provningsprotokoll</h2><button id="closeProtocol">×</button></div><div id="empty"><p>Tryck på en dörrmarkering.</p></div><div id="form" hidden><h2 id="formTitle"></h2><div class="grid2"><label>Dörr-ID<input id="doorId"></label><label>Maskin-ID<input id="machineId"></label><label>Placering / dörrlittra<input id="location"></label><label>Automatik / modell<input id="model"></label><label>AO / order<input id="ao"></label><label>Nästa provning<input id="nextDate" type="date"></label></div><label>Status<select id="status"><option value="untested">Ej provad</option><option value="ok">Godkänd</option><option value="action">Åtgärd krävs</option><option value="fail">Ej godkänd</option></select></label><h3>Checklista revision dörrautomatik</h3><div id="checklist"></div><label>Allmän info / anmärkning<textarea id="notes" rows="4"></textarea></label><label>Signatur<input id="signature"></label><button class="danger" id="deleteBtn">Ta bort dörr</button></div></aside></main>
<nav id="mobileBar"><button id="mobileAdd">＋ Dörr</button><button id="mobileProtocol">☑ Protokoll</button><button id="mobileFit">⌗ Passa</button></nav><script src="app.js"></script></body></html>
