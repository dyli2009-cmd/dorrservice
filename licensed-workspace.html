<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#132b38">
<title>Tillsyno</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}iframe{width:100%;height:100%;border:0;background:white}.gate{height:100%;display:grid;place-items:center;padding:24px;color:#15243a}.gate>div{width:min(520px,100%);padding:28px;border:1px solid #d8e3eb;border-radius:20px;background:white;text-align:center}.gate a{display:inline-block;margin-top:18px;color:#315f81;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div id="gate" class="gate"><div><strong>Kontrollerar modulåtkomst…</strong></div></div>
<script>
const STORAGE='tillsynoLicensedAccessV1';
const moduleKey=new URLSearchParams(location.search).get('module')||'';
let saved=null;
try{saved=JSON.parse(sessionStorage.getItem(STORAGE)||'null')}catch{}
const access=saved&&saved.access?saved.access:null;
const gate=document.getElementById('gate');
function denied(text){gate.innerHTML='<div><h2>Åtkomst saknas</h2><p>'+text+'</p><a href="./licensed-entry.html?menu=1">Till mina moduler</a></div>'}
if(!access||!Array.isArray(access.moduleKeys)||!access.moduleKeys.includes(moduleKey)){
  denied('Den här modulen är inte tilldelad till ditt konto.');
}else{
  const securityMap={las:'lock',passer:'access',inbrottslarm:'alarm'};
  let src='';
  if(moduleKey==='dorrautomatik') src='./index.html';
  else if(securityMap[moduleKey]) src='./security.html';
  else denied('Den här arbetsytan är inte färdigbyggd ännu.');
  if(src){
    gate.remove();
    const frame=document.createElement('iframe');
    frame.src=src;
    frame.title='Tillsyno arbetsyta';
    document.body.appendChild(frame);
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        if(!doc)return;
        if(moduleKey==='dorrautomatik'){
          doc.body.classList.remove('homeMode');
          const home=doc.getElementById('appHome'); if(home)home.hidden=true;
          const homeBtn=doc.getElementById('homeBtn');
          if(homeBtn)homeBtn.onclick=()=>{location.href='./licensed-entry.html?menu=1'};
          doc.querySelectorAll('.securityLaunch').forEach(el=>el.remove());
        }else{
          const allow=securityMap[moduleKey];
          doc.querySelectorAll('[data-add]').forEach(btn=>{
            if(btn.getAttribute('data-add')!==allow)btn.style.display='none';
          });
          const homeLink=doc.querySelector('.headerActions a[href="./"]');
          if(homeLink){
            homeLink.setAttribute('href','javascript:void(0)');
            homeLink.onclick=()=>{location.href='./licensed-entry.html?menu=1';return false};
          }
          const title=doc.querySelector('.brand strong');
          const labels={las:'Lås & Dörrmiljö',passer:'Passer',inbrottslarm:'Inbrottslarm'};
          if(title)title.textContent=labels[moduleKey]||'Säkerhetsservice';
        }
      }catch(e){}
    });
  }
}
</script>
</body>
</html>
