<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#132b38">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Tillsyno – licensierad åtkomst</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#f8fbff,#eef3f7);color:#15243a}
body.workspace{overflow:hidden;background:#fff}
.shell{width:min(760px,calc(100% - 32px));margin:0 auto;padding:50px 0 80px}
.workspace .shell{display:none}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:40px}
.mark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#142940;color:#fff;font-weight:800}
.card{padding:28px;border:1px solid #d8e3eb;border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(24,48,70,.08)}
.eyebrow{color:#4b7395;font-size:10px;font-weight:800;letter-spacing:.13em}
h1{margin:9px 0 8px;font-size:clamp(34px,7vw,52px);letter-spacing:-.045em}
.lead{margin:0;color:#66788b;line-height:1.65}
.status{margin:22px 0;padding:14px 16px;border-radius:14px;background:#f3f7fa;color:#597083;font-size:12px}
.list{display:grid;gap:10px;margin-top:18px}
.choice{width:100%;padding:17px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #dce5ec;border-radius:14px;background:#fff;color:#18344b;font:inherit;text-align:left;cursor:pointer}
.choice strong,.choice small{display:block}
.choice small{margin-top:4px;color:#7c8b98;font-size:11px}
.choice b{font-size:20px}
.choice.disabled{opacity:.55;cursor:not-allowed;background:#f7f9fb}
.error{margin-top:18px;padding:14px;border-radius:13px;border:1px solid #efcaca;background:#fff1f1;color:#8a3f3f;font-size:12px}
.back{display:inline-block;margin-top:20px;color:#315f81;font-size:12px;font-weight:700;text-decoration:none}
.frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<main class="shell">
  <div class="brand"><span class="mark">T</span><strong>Tillsyno</strong></div>
  <section class="card">
    <span class="eyebrow">LICENSIERAD ÅTKOMST</span>
    <h1 id="title">Kontrollerar åtkomst…</h1>
    <p id="lead" class="lead">Verifierar företag, licens och moduler.</p>
    <div id="status" class="status">Ansluter till Tillsyno-portalen…</div>
    <div id="list" class="list"></div>
    <div id="error" class="error" hidden></div>
    <a class="back" href="https://tillsyno-test.floot.app/konto">Till Tillsyno-portalen</a>
  </section>
</main>
<script>
(()=>{
'use strict';
const PORTAL='https://tillsyno-test.floot.app';
const STORAGE='tillsynoLicensedAccessV4';
const title=document.getElementById('title');
const lead=document.getElementById('lead');
const status=document.getElementById('status');
const list=document.getElementById('list');
const errorBox=document.getElementById('error');
const token=new URLSearchParams(location.search).get('token')||'';
const names={dorrautomatik:'Dörrautomatik',las:'Lås',brand:'Brand',passer:'Passer',inbrottslarm:'Inbrottslarm',cctv:'CCTV',ce_slr:'CE-märkning / SLR'};

function fail(message){
  title.textContent='Åtkomsten kunde inte öppnas';
  lead.textContent='Öppna Tillsyno på nytt från portalen.';
  status.hidden=true;
  list.innerHTML='';
  errorBox.hidden=false;
  errorBox.textContent=message||'Okänt fel.';
}
function save(access){try{sessionStorage.setItem(STORAGE,JSON.stringify(access))}catch(_){}}
function button(label,sub,fn,disabled){
  const b=document.createElement('button');
  b.type='button';
  b.className='choice'+(disabled?' disabled':'');
  b.innerHTML='<span><strong>'+label+'</strong><small>'+sub+'</small></span><b>'+(disabled?'':'›')+'</b>';
  if(!disabled)b.onclick=fn;
  list.appendChild(b);
}
function showModules(access){
  title.textContent='Hej '+(access.displayName||'');
  lead.textContent=(access.companyName||'Ditt företag')+' · välj arbetsområde.';
  status.hidden=false;
  status.textContent='Åtkomst verifierad · '+access.moduleKeys.length+' modul'+(access.moduleKeys.length===1?'':'er');
  list.innerHTML='';
  access.moduleKeys.forEach(key=>{
    if(key==='dorrautomatik')button('Dörrautomatik','Öppna modul',()=>showDoorAutomation(access),false);
    else if(['las','passer','inbrottslarm'].includes(key))button(names[key]||key,'Öppna arbetsyta',()=>openSecurity(key),false);
    else button(names[key]||key,'Arbetsyta byggs senare',()=>{},true);
  });
}
function showDoorAutomation(access){
  title.textContent='Dörrautomatik';
  lead.textContent='Välj vilket arbete du ska utföra.';
  status.textContent='Åtkomst verifierad · Dörrautomatik';
  list.innerHTML='';
  button('Checklista revision dörrautomatik','Revision och service · 18 kontrollpunkter',()=>openDoor('automation'),false);
  button('Egenkontroll dörrautomatik','Egenkontroll · 6 kontrollpunkter',()=>openDoor('automation_selfcheck'),false);
  button('‹ Till mina moduler','Gå tillbaka',()=>showModules(access),false);
}
function openDoor(protocol){
  const labels={automation:'Checklista revision dörrautomatik',automation_selfcheck:'Egenkontroll dörrautomatik'};
  document.body.classList.add('workspace');
  const frame=document.createElement('iframe');
  frame.className='frame';
  frame.src='./all-in-one.html?licensev4=1&ts='+Date.now();
  frame.title=labels[protocol];
  document.body.appendChild(frame);
  frame.addEventListener('load',()=>{
    let tries=0;
    const configure=()=>{
      tries++;
      try{
        const doc=frame.contentDocument;
        const win=frame.contentWindow;
        if(!doc||!win){if(tries<15)setTimeout(configure,100);return}
        if(win.AllInOneProtocols)win.AllInOneProtocols.set([protocol]);
        doc.querySelectorAll('#allProtocolDialog input[type="checkbox"][value]').forEach(cb=>cb.checked=cb.value===protocol);
        const dialog=doc.getElementById('allProtocolDialog');
        if(dialog&&dialog.open)dialog.close();
        doc.querySelectorAll('.allInOneProtocolTools [data-add]').forEach(btn=>{
          const ok=btn.getAttribute('data-add')===protocol;
          btn.hidden=!ok;
          btn.style.display=ok?'':'none';
        });
        const brand=doc.querySelector('.brand strong');
        if(brand)brand.textContent=labels[protocol];
        const subtitle=doc.querySelector('.headerSubtitle');
        if(subtitle)subtitle.textContent='Dörrautomatik · '+(protocol==='automation'?'revision':'egenkontroll');
        doc.querySelectorAll('a[href="./"]').forEach(link=>{
          link.setAttribute('href','javascript:void(0)');
          link.onclick=()=>{
            frame.remove();
            document.body.classList.remove('workspace');
            const access=JSON.parse(sessionStorage.getItem(STORAGE)||'null');
            if(access)showDoorAutomation(access);
            return false;
          };
        });
        if(!win.AllInOneProtocols&&tries<15)setTimeout(configure,100);
      }catch(e){
        if(tries<15)setTimeout(configure,100);
      }
    };
    setTimeout(configure,40);
  });
}
function openSecurity(key){
  const map={las:'lock',passer:'access',inbrottslarm:'alarm'};
  const allow=map[key];
  document.body.classList.add('workspace');
  const frame=document.createElement('iframe');
  frame.className='frame';
  frame.src='./security.html?licensev4=1&ts='+Date.now();
  frame.title=names[key]||'Tillsyno';
  document.body.appendChild(frame);
  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      doc.querySelectorAll('[data-add]').forEach(btn=>btn.style.display=btn.getAttribute('data-add')===allow?'':'none');
      const brand=doc.querySelector('.brand strong'); if(brand)brand.textContent=names[key]||'Säkerhetsservice';
      const home=doc.querySelector('.headerActions a[href="./"]');
      if(home){
        home.setAttribute('href','javascript:void(0)');
        home.onclick=()=>{
          frame.remove();
          document.body.classList.remove('workspace');
          const access=JSON.parse(sessionStorage.getItem(STORAGE)||'null');
          if(access)showModules(access);
          return false;
        };
      }
    }catch(_){}
  });
}
async function start(){
  if(!token){fail('Ingen startnyckel hittades.');return}
  try{
    const response=await fetch(PORTAL+'/_api/app/validate_launch',{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify({token})
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.message||'Verifieringen misslyckades.');
    history.replaceState(null,'',location.pathname);
    save(data.access);
    showModules(data.access);
  }catch(e){fail(e&&e.message?e.message:'Kunde inte verifiera åtkomsten.')}
}
start();
})();
</script>
</body>
</html>
